<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mala Zone</title>
  
  <!-- CDN Tailwind + DaisyUI -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- CSS Custom per Colori Brand -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen bg-white text-base-content flex flex-col justify-between">

  <!-- NAVBAR -->
  <header class="navbar bg-white text-base-content border-b border-gray-100 px-4 lg:px-8 sticky top-0 z-50">
    <div class="navbar-start">
      <a href="#" class="btn btn-ghost p-1 flex items-center">
        <img src="media/logo.png" alt="Mala Zone Logo" class="h-10 w-auto object-contain" />
      </a>
    </div>

    <!-- MENU DESKTOP -->
    <div class="navbar-center hidden lg:flex">
      <ul class="menu menu-horizontal px-1 font-medium gap-2">
        <li><a href="#chi-siamo">Chi siamo</a></li>
        <li><a href="#eventi">Eventi</a></li>
        <li><a href="#social">Social</a></li>
        <li><a href="#contatti">Contatti</a></li>
      </ul>
    </div>

    <!-- DESTRA: PULSANTE DESKTOP + HAMBURGER MOBILE -->
    <div class="navbar-end">
      <a href="#contatti" class="btn btn-primary btn-sm hidden lg:inline-flex">Diventa socio</a>

      <div class="dropdown dropdown-end lg:hidden">
        <div tabindex="0" role="button" class="btn btn-ghost btn-circle">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </div>
        <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-[1] p-3 shadow-lg bg-white rounded-box w-56 gap-2">
          <li><a href="#chi-siamo">Chi siamo</a></li>
          <li><a href="#eventi">Eventi</a></li>
          <li><a href="#social">Social</a></li>
          <li><a href="#contatti">Contatti</a></li>
          <div class="divider my-1"></div>
          <li><a href="#contatti" class="btn btn-primary btn-sm text-white">Diventa socio</a></li>
        </ul>
      </div>
    </div>
  </header>
 

  <!-- FOOTER -->
  <footer id="social" class="footer footer-center p-6 bg-white border-t border-gray-100 text-base-content mt-12">
    <aside>
      <p>© 2026 Mala Zone - Tutti i diritti riservati</p>
    </aside>
  </footer>

  <!-- SCRIPT JS ESTERNO -->
  <script src="script.js"></script>

</body>
</html>
